<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş Yap | Züccaciye</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/stil.css" rel="stylesheet">
</head>
<body class="bg-light">

<main class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5 col-lg-4">
            <div id="mesajlar"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-shop display-4"></i>
                        <h4 class="mt-2 mb-0">Züccaciye Yönetim Sistemi</h4>
                        <small class="text-muted">Devam etmek için giriş yapın</small>
                    </div>

                    <form id="girisFormu">
                        <div class="mb-3">
                            <label for="kullanici_adi" class="form-label">Kullanıcı adı</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="kullanici_adi" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="sifre" class="form-label">Şifre</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="sifre" required>
                                <button class="btn btn-outline-secondary" type="button" id="sifreGoster" title="Şifreyi göster">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100" id="girisButonu">
                            <i class="bi bi-box-arrow-in-right"></i> Giriş Yap
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ortak.js"></script>
<script>
    // Zaten giriş yapılmışsa doğrudan panele git
    fetch("/api/auth/ben").then(c => { if (c.ok) location.href = "/panel.html"; });

    document.getElementById("girisFormu").addEventListener("submit", async (e) => {
        e.preventDefault();                       // sayfa yenilenmesin
        const buton = document.getElementById("girisButonu");
        buton.disabled = true;
        try {
            await api("/api/auth/giris", "POST", {
                kullanici_adi: document.getElementById("kullanici_adi").value.trim(),
                sifre: document.getElementById("sifre").value,
            });
            location.href = "/panel.html";
        } catch (hata) {
            mesajGoster(hata.message, "danger");
            buton.disabled = false;
        }
    });

    document.getElementById("sifreGoster").addEventListener("click", function () {
        const alan = document.getElementById("sifre");
        const gizli = alan.type === "password";
        alan.type = gizli ? "text" : "password";
        this.querySelector("i").className = gizli ? "bi bi-eye-slash" : "bi bi-eye";
    });
</script>
</body>
</html>
